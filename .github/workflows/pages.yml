name: Deploy GitHub Pages
on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true # Will cancel ongoing jobs if two jobs end up running simultaneously

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: "24.14.1"

      - run: npm install

      - name: Set build variables
        run: |
          echo "PUBLIC_COMMIT=${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "PUBLIC_ENVIRONMENT=production" >> "${GITHUB_ENV}"
          echo "PUBLIC_RELEASE=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
      - run: npm run build

      - name: Upload assets to Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

      - name: Zip build directory
        if: github.ref_type == 'tag' && github.event_name == 'release'
        run: tar -czvf ${{ github.ref_name }}.tar.gz build

      - name: Upload assets to tag
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag' && github.event_name == 'release'
        with:
          files: |
            ${{ github.ref_name }}.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5